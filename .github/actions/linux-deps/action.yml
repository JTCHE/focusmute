name: Linux build dependencies
description: Install the system libraries the audio, tray and GUI crates link against.

runs:
  using: composite
  steps:
    # The cache action installs from the image's stale package lists and runs
    # apt-fast, which exits 0 on failed downloads and then caches an empty set.
    # Refresh the lists, and stand apt-get in so a failed install fails the job.
    - name: Prepare apt
      shell: bash
      run: |
        sudo apt-get update
        printf '#!/bin/sh\nexec apt-get "$@"\n' | sudo tee /usr/local/bin/apt-fast > /dev/null
        sudo chmod +x /usr/local/bin/apt-fast

    - name: Install packages
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: libpulse-dev pkg-config libasound2-dev libgtk-3-dev libxdo-dev libappindicator3-dev libxkbcommon-dev libegl-dev libssl-dev
