version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Has to match the `windows` crate's version; bump the pair by hand.
      - dependency-name: windows-core
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
      cargo-version:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-version:
        applies-to: version-updates
        patterns:
          - "*"
